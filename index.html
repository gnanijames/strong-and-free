<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ── TOKENS ──────────────────────────────────────────────────────────── */
:root {
  --cream:   #FAF6F0;
  --cream2:  #F3EDE4;
  --forest:  #1A4731;
  --green:   #2D6A4F;
  --orange:  #E8621A;
  --border:  rgba(26,71,49,0.13);
  --tint:    rgba(26,71,49,0.055);
  --shadow:  0 2px 24px rgba(26,71,49,0.10);
  --body-size: 17px;
  --r: 16px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family: Georgia, "Times New Roman", serif;
  font-size: var(--body-size);
  line-height: 1.65;
  color: var(--forest);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
}
img { display:block; max-width:100%; }
a { color:inherit; text-decoration:none; }
button { cursor:pointer; font-family:inherit; border:none; background:none; }
ul { list-style:none; }
textarea, input { font-family:inherit; }
.fade-up { opacity:0; transform:translateY(22px); transition:opacity 0.55s ease,transform 0.55s ease; }
.fade-up.in { opacity:1; transform:translateY(0); }
.btn-cta { display:inline-block; background:var(--orange); color:#fff; font-family:Georgia,serif; font-size:1rem; font-weight:bold; padding:14px 32px; border-radius:999px; border:2px solid var(--orange); transition:opacity 0.18s,transform 0.18s; text-align:center; cursor:pointer; }
.btn-cta:hover { opacity:0.88; transform:translateY(-1px); }
.btn-cta.btn-lg { font-size:1.05rem; padding:16px 38px; }
.btn-ghost { display:inline-block; background:transparent; color:var(--forest); font-family:Georgia,serif; font-size:1rem; font-weight:bold; padding:14px 32px; border-radius:999px; border:2px solid var(--border); transition:background 0.18s,border-color 0.18s; cursor:pointer; }
.btn-ghost.btn-lg { font-size:1.05rem; padding:16px 38px; }
.btn-ghost:hover { background:rgba(26,71,49,0.07); border-color:rgba(26,71,49,0.25); }
.btn-outline { display:inline-block; background:transparent; color:var(--forest); font-family:Georgia,serif; font-weight:bold; padding:13px 28px; border-radius:999px; border:2px solid var(--border); transition:all 0.18s; text-align:center; font-size:0.95rem; cursor:pointer; }
.btn-outline:hover { background:var(--tint); }
.btn-outline-light { display:inline-block; background:transparent; color:rgba(250,246,240,0.85); font-family:Georgia,serif; font-weight:bold; padding:13px 28px; border-radius:999px; border:2px solid rgba(250,246,240,0.3); transition:all 0.18s; text-align:center; font-size:0.95rem; cursor:pointer; }
.btn-outline-light:hover { background:rgba(250,246,240,0.1); border-color:rgba(250,246,240,0.55); }
.hdr { position:fixed; top:0; left:0; right:0; z-index:100; background:var(--cream); border-bottom:1px solid transparent; transition:border-color 0.25s,box-shadow 0.25s,background 0.25s; }
.hdr.scrolled { border-color:var(--border); box-shadow:0 2px 20px rgba(26,71,49,0.07); background:rgba(250,246,240,0.96); backdrop-filter:blur(10px); }
.hdr-inner { max-width:1180px; margin:0 auto; padding:0 24px; height:72px; display:flex; align-items:center; gap:32px; }
.logo-btn { background:none; border:none; padding:0; cursor:pointer; flex-shrink:0; }
.logo-img { height:44px; width:auto; }
.main-nav { display:flex; gap:4px; flex:1; }
.nav-link { background:none; border:none; font-family:Georgia,serif; font-size:0.92rem; color:var(--forest); padding:8px 14px; border-radius:8px; opacity:0.75; transition:opacity 0.15s,background 0.15s; cursor:pointer; white-space:nowrap; }
.nav-link:hover { opacity:1; background:var(--tint); }
.hdr-right { display:flex; align-items:center; gap:10px; margin-left:auto; flex-shrink:0; }

.prog-tag { font-size:0.7rem; font-weight:bold; letter-spacing:0.12em; text-transform:uppercase; color:var(--orange); margin-bottom:12px; display:block; }
